<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Select Serial Port</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #0b0f14;
      color: #cbd5e1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: no-drag;
    }

    /* ── Header ── */
    .header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid #1e2836;
      flex-shrink: 0;
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .header-title svg { flex-shrink: 0; }
    .header-title h2 { font-size: 14px; font-weight: 600; color: #e2e8f0; }
    .header-sub { font-size: 11px; color: #475569; padding-left: 26px; }

    /* ── Device list ── */
    .list-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .list-wrap::-webkit-scrollbar { width: 4px; }
    .list-wrap::-webkit-scrollbar-track { background: transparent; }
    .list-wrap::-webkit-scrollbar-thumb { background: #1e2836; border-radius: 2px; }

    .empty {
      padding: 32px 16px;
      text-align: center;
      color: #475569;
    }
    .empty svg { display: block; margin: 0 auto 12px; opacity: 0.4; }
    .empty p { font-size: 12px; line-height: 1.6; }

    .device {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      margin-bottom: 4px;
      background: #0f1923;
      border: 1px solid #1a2535;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.1s, border-color 0.12s;
    }
    .device:last-child { margin-bottom: 0; }
    .device:hover { background: #162030; border-color: #a78bfa; }
    .device:active { background: #1a2038; }

    .device-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: #1a2535;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .device-info { flex: 1; min-width: 0; }
    .device-name {
      font-size: 13px;
      font-weight: 500;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .device-id {
      font-size: 10px;
      color: #475569;
      font-family: 'SF Mono', 'Fira Code', monospace;
      margin-top: 1px;
    }

    .device-arrow { color: #334155; flex-shrink: 0; }
    .device:hover .device-arrow { color: #a78bfa; }

    /* ── Footer ── */
    .footer {
      display: flex;
      gap: 6px;
      padding: 10px;
      border-top: 1px solid #1e2836;
      flex-shrink: 0;
    }
    button {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #1e2836;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: background 0.1s, opacity 0.1s;
    }
    button:disabled { opacity: 0.45; cursor: default; }
    .btn-cancel { background: #0f1923; color: #94a3b8; }
    .btn-cancel:hover:not(:disabled) { background: #162030; }
    .btn-rescan { background: rgba(167,139,250,0.12); color: #a78bfa; border-color: rgba(167,139,250,0.3); }
    .btn-rescan:hover:not(:disabled) { background: rgba(167,139,250,0.2); }

    /* Spin animation for rescan indicator */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.8s linear infinite; display: inline-block; }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-title">
      <!-- USB plug icon -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v11"/><path d="M9 7l3-5 3 5"/>
        <rect x="7" y="13" width="10" height="6" rx="2"/>
        <path d="M9 19v2a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1v-2"/>
      </svg>
      <h2>Select Serial Port</h2>
    </div>
    <div class="header-sub" id="subtitle">Choose a port to connect</div>
  </div>

  <!-- Port list -->
  <div class="list-wrap" id="list-wrap">
    <div class="empty" id="empty" style="display:none">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 2v11"/><path d="M9 7l3-5 3 5"/>
        <rect x="7" y="13" width="10" height="6" rx="2"/>
      </svg>
      <p>No serial ports found.<br>Connect your USB device, then click <strong style="color:#a78bfa">Rescan</strong>.</p>
    </div>
    <ul id="list" style="list-style:none"></ul>
  </div>

  <!-- Footer -->
  <div class="footer">
    <button class="btn-cancel" id="btn-cancel">Cancel</button>
    <button class="btn-rescan" id="btn-rescan">⟳ Rescan</button>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const listEl     = document.getElementById('list');
    const emptyEl    = document.getElementById('empty');
    const subtitleEl = document.getElementById('subtitle');
    const btnRescan  = document.getElementById('btn-rescan');
    const btnCancel  = document.getElementById('btn-cancel');

    function render(ports) {
      listEl.innerHTML = '';

      if (!ports || ports.length === 0) {
        emptyEl.style.display = 'block';
        subtitleEl.textContent = 'No ports detected';
        return;
      }

      emptyEl.style.display = 'none';
      subtitleEl.textContent = `${ports.length} port${ports.length !== 1 ? 's' : ''} available`;

      ports.forEach(p => {
        const name = p.displayName || p.portName || 'Unknown Port';
        const sub  = p.portName || '';

        const li = document.createElement('li');
        li.className = 'device';
        li.innerHTML = `
          <div class="device-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v11"/><path d="M9 7l3-5 3 5"/>
              <rect x="7" y="13" width="10" height="6" rx="2"/>
            </svg>
          </div>
          <div class="device-info">
            <div class="device-name">${name}</div>
            <div class="device-id">${sub}</div>
          </div>
          <svg class="device-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        `;
        li.addEventListener('click', () => ipcRenderer.send('serial-select', p.portId));
        listEl.appendChild(li);
      });
    }

    ipcRenderer.on('serial-ports', (_, ports) => render(ports));

    btnCancel.addEventListener('click', () => ipcRenderer.send('serial-select', ''));

    btnRescan.addEventListener('click', () => {
      btnRescan.disabled = true;
      btnCancel.disabled = true;
      btnRescan.textContent = '↺ Scanning…';
      ipcRenderer.send('serial-rescan');
    });
  </script>
</body>
</html>
